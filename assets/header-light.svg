<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340" role="img" aria-labelledby="title desc">
  <title id="title">野原 拓人（Takuto Nohara）</title>
  <desc id="desc">Webエンジニアをめざす大学生。工学院大学 / 株式会社Zequt。モットー：欲しいものが見当たらないなら、自分で作る。</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif; }
    .type { transform-box: fill-box; transform-origin: left; animation: type 0.7s steps(10) both; }
    .t2 { animation-delay: 1.6s; }
    .fade { animation: fade 0.5s ease-out both; }
    .d1 { animation-delay: 0.9s; } .d2 { animation-delay: 1.15s; } .d3 { animation-delay: 2.5s; }
    .cursor { animation: blink 1.1s step-end infinite; }
    @keyframes type { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="c1"><rect class="type" x="56" y="78" width="150" height="34"/></clipPath>
    <clipPath id="c2"><rect class="type t2" x="56" y="232" width="240" height="34"/></clipPath>
  </defs>

  <rect width="840" height="340" fill="#ffffff"/>
  <rect x="8" y="8" width="824" height="324" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <path d="M8 20a12 12 0 0 1 12-12h800a12 12 0 0 1 12 12v24H8z" fill="#eaeef2"/>
  <line x1="8" y1="44" x2="832" y2="44" stroke="#d0d7de"/>
  <circle cx="32" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="52" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>
  <text x="420" y="31" text-anchor="middle" class="mono" font-size="14" fill="#4b535d">takuto-nohara — profile</text>

  <g clip-path="url(#c1)">
    <text x="56" y="104" class="mono" font-size="22"><tspan fill="#1a7f37" font-weight="700">$</tspan><tspan fill="#1f2328"> whoami</tspan></text>
  </g>
  <g class="fade d1">
    <text x="56" y="164" class="sans" font-size="46" font-weight="700" fill="#1f2328">野原 拓人<tspan dx="20" class="mono" font-size="26" font-weight="400" fill="#4b535d">Takuto Nohara</tspan></text>
  </g>
  <g class="fade d2">
    <text x="56" y="208" class="sans" font-size="22" fill="#1f2328">Webエンジニアをめざす大学生<tspan fill="#4b535d">　｜　工学院大学 / 株式会社Zequt</tspan></text>
  </g>

  <g clip-path="url(#c2)">
    <text x="56" y="258" class="mono" font-size="22"><tspan fill="#1a7f37" font-weight="700">$</tspan><tspan fill="#1f2328"> cat motto.txt</tspan></text>
  </g>
  <g class="fade d3">
    <text x="56" y="302" class="sans" font-size="24" font-weight="700" fill="#bc4c00">欲しいものが見当たらないなら、自分で作る。<tspan class="cursor" fill="#1a7f37"> ▍</tspan></text>
  </g>
</svg>
